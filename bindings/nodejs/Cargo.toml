[package]
name = "zen-nodejs"
version = "2.1.8"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ahash = { workspace = true }
napi = { version = "3.14", features = ["serde-json", "error_anyhow", "tokio_rt"] }
napi-sys = "3.4"
napi-derive = "3.6"
tokio-util = { workspace = true, features = ["rt"] }
serde_json = { workspace = true }
zen-engine = { path = "../../core/engine", features = ["arbitrary_precision"] }
zen-expression = { path = "../../core/expression", features = ["arbitrary_precision"] }
zen-tmpl = { path = "../../core/template" }
serde = { workspace = true, features = ["derive"] }
json_dotpath = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
iana-time-zone = { version = "0.1", features = ["fallback"] }
napi-async-runtime = "0.2.6"

[build-dependencies]
napi-build = "2.6"